<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17131C">
  <title>Cubatero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Archivo:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cb-app">
    <header class="cb-top">
      <span class="cb-mark">Cubatero</span>
      <select id="year" class="cb-year" aria-label="Año"></select>
    </header>

    <main id="view"></main>

    <nav class="cb-nav" id="nav" role="tablist">
      <button class="cb-navbtn" role="tab" data-tab="barra">Barra</button>
      <button class="cb-navbtn" role="tab" data-tab="año">El año</button>
      <button class="cb-navbtn" role="tab" data-tab="cuenta">La cuenta</button>
      <button class="cb-navbtn" role="tab" data-tab="ajustes">Ajustes</button>
    </nav>
  </div>

  <div id="sheet-root"></div>

  <script src="app.js"></script>
</body>
</html>
